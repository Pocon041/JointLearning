[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jointlearning-cod-iml"
version = "0.1.0"
description = "Frequency-guided COD/IML joint learning with shared Q/KV adaptation and private scale exits"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "Pillow>=10", "scikit-learn>=1.3"]

[project.optional-dependencies]
eval = ["pysodmetrics==1.6.2"]
test = ["pytest>=8"]

[project.scripts]
jointlearning-train = "cod_iml_evp_joint_v3.train:main"
jointlearning-audit = "cod_iml_evp_joint_v3.audit:main"
jointlearning-configs = "tools.prepare_configs:main"
jointlearning-predict = "tools.predict:main"

[tool.setuptools.packages.find]
include = ["jointlearning*", "cod_iml_*", "tools"]
exclude = ["tests*"]

[tool.setuptools.package-data]
cod_iml_evp_official_aligned = ["*.txt", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
